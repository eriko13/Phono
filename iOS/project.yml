# Run `xcodegen` in this folder to make Phono.xcodeproj.
name: Phono
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  Phono:
    path: ..
targets:
  Phono:
    type: application
    platform: iOS
    sources: [Phono]
    dependencies:
      - package: Phono
        products: [PhonoCore, PhonoKit]
    info:
      path: Phono/Info.plist
      properties:
        CFBundleDisplayName: Phono
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Phono records what you say and sends it to your Phonon server to turn it into text.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eriko13.phono.ios
        DEVELOPMENT_TEAM: Z3JJYD8Y48
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
